name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              printf '%s\n' "$out"
              status=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: Smoke tests
        run: php tests/run-tests.php

      - name: Verify version alignment
        run: |
          set -euo pipefail
          header=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' eweb-cf7-signature.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          pot=$(grep -m1 -oE 'Project-Id-Version:.* [0-9]+\.[0-9]+\.[0-9]+' languages/eweb-cf7-signature.pot | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          echo "main file: $header | readme.txt: $stable | .pot: $pot"
          test "$header" = "$stable"
          test "$header" = "$pot"

      - name: Check the Contact Form 7 contract against the latest release
        if: matrix.php == '8.3'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/cf7.zip https://downloads.wordpress.org/plugin/contact-form-7.zip
          unzip -q /tmp/cf7.zip -d /tmp/cf7
          php tests/check-cf7-contract.php /tmp/cf7/contact-form-7

  standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install the coding standards
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer lint
